name: Build CrecemosUno PanoPilot APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'luna-panoshooter/**'
      - '.github/workflows/luna-panoshooter-apk.yml'
  push:
    branches: [ luna-panoshooter-apk ]
    paths:
      - 'luna-panoshooter/**'
      - '.github/workflows/luna-panoshooter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply visible product name
        run: |
          sed -i 's/Luna PanoShooter/CrecemosUno PanoPilot/g' luna-panoshooter/app/src/main/java/es/mcd3/lunapanoshooter/LunaAccessibilityService.java
          sed -i 's/LunaPanoShooterSequence/CrecemosUnoPanoPilotSequence/g' luna-panoshooter/app/src/main/java/es/mcd3/lunapanoshooter/LunaAccessibilityService.java

      - name: Build debug APK
        working-directory: luna-panoshooter
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crecemosuno-panopilot-beta
          path: luna-panoshooter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
